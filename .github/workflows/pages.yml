name: Build and deploy web version

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build single-file page
        run: python3 web/build.py

      # Pages 的「Deploy from a branch」只能选仓库根或 /docs 两个位置，
      # 而把 index.html 放仓库根会让 Pages 把整个仓库当站点发布。
      # 所以这里另建 _site 目录，只上传真正要公开的文件。
      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/kindleunpack.html _site/index.html
          cp web/docs/architecture.html _site/architecture.html
          touch _site/.nojekyll

      # 传一份给 release job，让它发布的字节与部署上线的完全一致，
      # 而不是在另一个 runner 上重新构建一遍。
      - name: Stage downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: kindleunpack-html
          path: web/kindleunpack.html
          if-no-files-found: error

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 与 deploy 并列而非串联：release 失败不会连累站点部署。
  # 写权限只给这个 job。
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kindleunpack-html

      # runner 是 UTC，这里换算到作者所在时区，免得凌晨构建被标成前一天。
      - id: stamp
        run: echo "date=$(TZ=Asia/Shanghai date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # 每次构建发一个自己的 release，而不是往固定 tag 上覆盖旧资产，
      # 于是历史版本连同资产一起留在 Releases 页上。
      # tag 里的 run_number 保证唯一，同一天多次推送不会撞车，
      # 也就不存在「覆盖别人资产」这回事。
      # 下载地址仍然固定：新 release 每次都 make_latest，
      # /releases/latest/download/kindleunpack.html 始终指向最新构建。
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.stamp.outputs.date }}-${{ github.run_number }}
          name: ${{ steps.stamp.outputs.date }}
          make_latest: true
          files: kindleunpack.html
          body: |
            由 CI 从 master 分支自动构建的单文件版本。

            下载 `kindleunpack.html` 后直接双击即可在浏览器打开（首次需要联网
            加载 Pyodide 运行时）。

            在线版：https://oliviaswitch.github.io/KindleUnpackWeb/
